name: refresh-momo-checkpoint
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  repository_dispatch:
    types: [refund]
permissions: { contents: write }
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci && node scripts-refund.mjs && node scripts-checkpoint.mjs
      - run: |
          git config user.name "momo-checkpoint" && git config user.email "bot@users.noreply.github.com"
          git add web/public/checkpoint.json web/public/refunds.json
          git diff --cached --quiet || git commit -m "checkpoint: refresh Momo state (auto)" && git push

      - name: Trigger the deploy
        # REQUIRED for the demo to stay fresh. This repo was moved
        # (Stellar-Light -> theboycoder); git pushes follow GitHub's 301 but
        # Vercel's webhook does not, so pushing alone deploys NOTHING. A
        # Deploy Hook is repo-path independent and fixes that for good.
        # Set VERCEL_DEPLOY_HOOK in repo secrets. No-ops if unset.
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" >/dev/null && echo "deploy hook fired"; else echo "::warning::VERCEL_DEPLOY_HOOK is not set — the checkpoint will NOT reach production"; fi
